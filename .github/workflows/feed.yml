name: Update job feed

# One run updates the feed every 10 minutes for about 5 hours (a full run every 30 minutes,
# quick employer-only runs in between), then starts the next run itself, so it keeps going
# around the clock. GitHub's own schedule runs far less often than asked when GitHub is busy;
# the cron below only restarts the chain if a run ever fails to start its successor.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write   # publish feed/
  actions: write    # start the next run

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update the feed every 10 minutes for about 5 hours
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional phone alerts
        run: |
          git config user.name "jobscout-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deadline=$((SECONDS + 300 * 60))
          while [ $SECONDS -lt $deadline ]; do
            started=$SECONDS
            git pull -q --rebase -X theirs || true
            python feed.py auto || echo "::warning::feed run failed"
            git add -A feed
            if ! git diff --cached --quiet; then
              git commit -qm "Update job feed ($(python -c 'import json; print(json.load(open("feed/status.json"))["mode"])'))"
              git pull -q --rebase -X theirs && git push -q || echo "::warning::couldn't publish the feed"
            fi
            wait=$((10 * 60 - (SECONDS - started)))
            [ $((SECONDS + wait)) -ge $deadline ] && break
            [ $wait -gt 0 ] && sleep $wait
          done
      - name: Start the next run
        if: success() || failure()   # not after a manual cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run feed.yml --ref ${{ github.ref_name }}
      # A source that found nothing 3 runs in a row fails the run, so GitHub emails you.
      - name: Check every source still finds jobs
        run: python feed.py check
