name: Update job feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start a few minutes late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python feed.py
      - name: Publish the new feed
        run: |
          git config user.name "jobscout-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed
          git diff --cached --quiet && exit 0
          git commit -m "Update job feed"
          git pull --rebase -X theirs
          git push
